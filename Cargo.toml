[package]
name = "voz-traductor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Traductor de voz en tiempo real: micrófono virtual, subtítulos y doblaje con el LLM que elijas"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
hound = "3.5.1"
libloading = "0.9.0"
minimp3 = "0.6.1"
msedge-tts = "0.4.1"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
transcribe-rs = { version = "0.3.12", features = ["onnx", "vad-silero"] }
whatlang = "0.18.0"
winit = { version = "0.30.13", default-features = false, features = ["x11", "rwh_06"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
